<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ agent_name }} - Voice Agent</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </div>
                    <h1>{{ agent_name }}</h1>
                </div>
                <div class="provider-badge" id="providerBadge">{{ provider }}</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Status Display -->
            <div class="status-section">
                <div class="status-indicator" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span id="statusText">Ready to connect</span>
                </div>
            </div>

            <!-- Audio Visualizer -->
            <div class="visualizer-section">
                <canvas id="visualizer" width="600" height="200"></canvas>
                <div class="agent-avatar" id="agentAvatar">
                    <div class="avatar-ring" id="avatarRing">
                        <div class="avatar-core">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Transcript Area -->
            <div class="transcript-section">
                <div class="transcript-container" id="transcriptContainer">
                    <div class="transcript-placeholder" id="transcriptPlaceholder">
                        Conversation transcript will appear here...
                    </div>
                </div>
            </div>

            <!-- Tool Calls Display -->
            <div class="tools-section" id="toolsSection" style="display: none;">
                <div class="tools-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                    <span>Tool Activity</span>
                </div>
                <div id="toolCallsLog"></div>
            </div>

            <!-- Controls -->
            <div class="controls-section">
                <!-- Text Input Fallback -->
                <div class="text-input-row">
                    <input type="text" id="textInput" placeholder="Type a message (or use voice)..." />
                    <button id="sendTextBtn" class="btn btn-send" title="Send text">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>

                <div class="button-row">
                    <button id="connectBtn" class="btn btn-primary">
                        Connect
                    </button>
                    <button id="micBtn" class="btn btn-mic" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                    <button id="disconnectBtn" class="btn btn-danger" disabled>
                        Disconnect
                    </button>
                </div>

                <!-- Settings Row -->
                <div class="settings-row">
                    <label class="setting">
                        <span>Provider:</span>
                        <select id="providerSelect">
                            <option value="github">GitHub Models (Free)</option>
                            <option value="openai">OpenAI Realtime</option>
                            <option value="elevenlabs">ElevenLabs</option>
                        </select>
                    </label>
                    <label class="setting">
                        <span>Voice:</span>
                        <select id="voiceSelect">
                            <option value="en-US-AndrewMultilingualNeural">Andrew (EN)</option>
                            <option value="en-US-AvaMultilingualNeural">Ava (EN)</option>
                            <option value="en-US-BrianMultilingualNeural">Brian (EN)</option>
                            <option value="en-US-EmmaMultilingualNeural">Emma (EN)</option>
                            <option value="en-GB-SoniaNeural">Sonia (UK)</option>
                            <option value="en-ZA-LeahNeural">Leah (ZA)</option>
                            <option value="alloy">Alloy (OpenAI)</option>
                            <option value="nova">Nova (OpenAI)</option>
                            <option value="shimmer">Shimmer (OpenAI)</option>
                        </select>
                    </label>
                    <label class="setting toggle">
                        <span>Tools:</span>
                        <input type="checkbox" id="toolsToggle" checked />
                    </label>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Built with FastAPI + GitHub Models (GPT-4o) + Edge-TTS + OpenAI Realtime API</p>
        </footer>
    </div>

    <script src="/static/js/audio-processor.js"></script>
    <script src="/static/js/visualizer.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
